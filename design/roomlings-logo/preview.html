<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roomlings / Patchwork identity</title>
    <link rel="icon" href="exports/roomlings-icon-flat.svg">
    <link rel="stylesheet" href="exports/preview-font.css">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #fcf9f1; color: #3d405b; font-family: "Roomlings DM Sans", sans-serif; }
      main { max-width: 1360px; margin: auto; padding: 42px; }
      header, footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px; }
      header { border-bottom: 1px solid #d8ddcf; padding-bottom: 22px; }
      h1 { font-size: 22px; font-weight: 500; margin: 0; }
      header p, footer { font-size: 12px; color: #67705f; }
      header p { margin: 0; }
      .hero { display: grid; place-items: center; min-height: 280px; padding: 32px 14px; }
      .hero img { display: block; width: min(100%, 900px); height: auto; }
      .variants { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
      figure { margin: 0; background: #eef0e4; border-radius: 12px; padding: 22px; text-align: center; }
      figure:last-child { background: #344238; color: #fcf9f1; }
      figure img { width: 172px; height: 172px; display: block; margin: auto; }
      figcaption { font-size: 12px; margin-top: 14px; }
      .sizes { display: flex; align-items: end; justify-content: space-around; gap: 20px; flex-wrap: wrap; border-top: 1px solid #d8ddcf; margin-top: 28px; padding-top: 25px; }
      .sizes > div { display: grid; justify-items: center; gap: 12px; font-size: 11px; color: #67705f; }
      .sizes img { display: block; }
      footer { border-top: 1px solid #d8ddcf; margin-top: 27px; padding-top: 20px; line-height: 1.7; }
      nav { display: flex; flex-wrap: wrap; gap: 16px; }
      a { color: #527861; text-underline-offset: 3px; }
      a:focus-visible { outline: 3px solid #b8533b; outline-offset: 4px; }
      @media (max-width: 640px) {
        main { padding: 25px 20px; }
        .hero { min-height: 210px; padding: 28px 0; }
        .variants { gap: 10px; }
        figure { padding: 15px 8px; }
        figure img { width: 84px; height: 84px; max-width: 100%; }
        figcaption { font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <main id="identity-board">
      <header>
        <h1>Roomlings / Patchwork identity</h1>
        <p>Flat illustration + Baloo 2 lettering. Static loading mark.</p>
      </header>
      <section class="hero" aria-label="Approved logo">
        <img src="exports/roomlings-lockup-flat.svg" alt="Roomlings: the four-colour Patchwork icon and lowercase Baloo 2 wordmark">
      </section>
      <section class="variants" aria-label="Icon treatments">
        <figure><img src="exports/roomlings-icon-flat.svg" width="256" height="256" alt="Colour Patchwork icon"><figcaption>Colour icon and loader</figcaption></figure>
        <figure><img src="exports/roomlings-icon-mono.svg" width="256" height="256" alt="Single-ink Patchwork icon"><figcaption>One-colour artwork</figcaption></figure>
        <figure><img src="exports/roomlings-icon-light.svg" width="256" height="256" alt="Light Patchwork icon"><figcaption>Light icon and loader</figcaption></figure>
      </section>
      <section class="sizes" aria-label="Static loading marks at actual display sizes">
        <div><img src="exports/roomlings-icon-flat.svg" width="16" height="16" alt=""><span>16px</span></div>
        <div><img src="exports/roomlings-icon-flat.svg" width="24" height="24" alt=""><span>24px</span></div>
        <div><img src="exports/roomlings-icon-flat.svg" width="32" height="32" alt=""><span>32px</span></div>
        <div><img src="exports/roomlings-icon-flat.svg" width="48" height="48" alt=""><span>48px</span></div>
        <div><img src="exports/roomlings-icon-flat.svg" width="64" height="64" alt=""><span>64px</span></div>
      </section>
      <footer>
        <span>Baloo 2: logo 650, display text 600. DM Sans: body and controls.<br>The loading mark is static in every motion mode.</span>
        <nav aria-label="Editable design sources">
          <a href="source/icon-flat.svg" download>Icon source</a>
          <a href="exports/roomlings-wordmark.svg" download>Outlined wordmark</a>
          <a href="exports/roomlings-lockup-flat.svg" download>Full SVG logo</a>
          <a href="DESIGN-HANDOFF.md">Design handoff</a>
        </nav>
      </footer>
    </main>
  </body>
</html>
