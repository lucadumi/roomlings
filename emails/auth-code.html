<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Your Roomlings sign-in code</title>
  </head>
  <body style="margin:0;padding:0;background-color:#ffffff;color:#3d405b;font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;">
    <div aria-hidden="true" style="display:none;max-height:0;overflow:hidden;opacity:0;font-size:1px;line-height:1px;">
      Your one-time Roomlings code.
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#ffffff;background-image:radial-gradient(rgba(61,64,91,0.094) 1.5px, transparent 1.8px);background-size:32px 32px;">
      <tr>
        <td align="center" style="padding:40px 16px 56px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;">
            <tr>
              <td style="padding:0 0 22px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                  <tr>
                    <td style="padding:0 9px 0 0;font-size:0;line-height:0;" valign="middle">
                      <img id="roomlings-mark" src="https://YOUR-PROJECT-REF.supabase.co/storage/v1/object/public/brand/roomlings-icon-flat-256.png" alt="" width="40" height="40" border="0" style="display:block;width:40px;height:40px;border:0;outline:none;">
                    </td>
                    <td id="roomlings-wordmark" valign="middle" style="font-family:'Baloo 2','Trebuchet MS',Verdana,Geneva,sans-serif;font-size:28px;font-weight:bold;letter-spacing:-1.5px;line-height:1.1;color:#3d405b;">roomlings</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;background-color:#ffffff;border:1px solid #d6d8e0;border-radius:15px;box-shadow:0 5px 0 #809b5947, 0 24px 65px #334b2733;">
                <h1 style="margin:0 0 10px;font-family:'Baloo 2','Trebuchet MS',Verdana,Geneva,sans-serif;font-size:30px;font-weight:500;letter-spacing:-1.2px;line-height:1.17;color:#3d405b;">
                  Your sign-in code.
                </h1>
                <p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#696b7e;">
                  Enter it in the Roomlings tab you left open.
                </p>
                <p id="roomlings-code" style="margin:0 0 20px;padding:18px 8px;background-color:#edf5f0;border:1px solid #b5d3c3;border-radius:8px;box-shadow:inset 0 2px 0 #79a44b24;text-align:center;font-family:'Courier New',Courier,monospace;font-size:28px;font-weight:bold;letter-spacing:2px;line-height:1.4;color:#3d405b;">{{ .Token }}</p>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#696b7e;">
                  No link to click. It works once, and you can request a new one if it expires.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:26px 4px 0;font-size:12px;line-height:1.6;color:#696b7e;">
                <p style="margin:0;">Keep it private. Not you? Ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
