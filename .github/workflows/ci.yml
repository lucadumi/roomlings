name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
  browser:
    name: Browser checks (${{ matrix.suite }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: household-1
            args: --grep-invert @room --fully-parallel --shard=1/4
          - suite: household-2
            args: --grep-invert @room --fully-parallel --shard=2/4
          - suite: household-3
            args: --grep-invert @room --fully-parallel --shard=3/4
          - suite: household-4
            args: --grep-invert @room --fully-parallel --shard=4/4
          - suite: room-1
            args: --grep @room --fully-parallel --shard=1/4
          - suite: room-2
            args: --grep @room --fully-parallel --shard=2/4
          - suite: room-3
            args: --grep @room --fully-parallel --shard=3/4
          - suite: room-4
            args: --grep @room --fully-parallel --shard=4/4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:browser -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  postgres:
    name: PostgreSQL persistence and account flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: roomlings
          POSTGRES_PASSWORD: roomlings
          POSTGRES_DB: roomlings_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U roomlings -d roomlings_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://roomlings:roomlings@127.0.0.1:5432/roomlings_test
      TEST_DATABASE_TLS: disable
      REQUIRE_POSTGRES_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/postgres.test.ts tests/mutations-api.test.ts
      - name: Run account flows with preinstalled browsers
        run: |
          docker run --rm --init --ipc=host --network host \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --env CI=true --env TEST_DATABASE_URL --env TEST_DATABASE_TLS --env REQUIRE_POSTGRES_TESTS \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            npm run test:browser -- accounts.spec.ts account-recovery.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: postgres-browser-failure-details
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  kitchen:
    name: Build and exercise the shared kitchen
    if: ${{ always() }}
    needs: [checks, browser, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          printf 'Unit/build: %s\nBrowser suites: %s\nPostgreSQL: %s\n' "$CHECKS_RESULT" "$BROWSER_RESULT" "$POSTGRES_RESULT"
          test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success && test "$POSTGRES_RESULT" = success
